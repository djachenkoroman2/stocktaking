{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-sm-8 col-md-5 col-lg-4">
  <h1 class="h3 mb-3">Учёт НИР — вход</h1>
  {% if switch_from %}
  <div class="alert alert-info">Вы вышли из учётной записи «{{ switch_from }}». Войдите под другой учётной записью.</div>
  {% endif %}
  <form method="post">{% csrf_token %}
    {% include 'includes/form_fields.html' %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100">Войти</button>
  </form>
</div></div>
{% endblock %}
