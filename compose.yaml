# «Учёт НИР»: docker compose up -d (ТЗ 11.2). Переменные — в .env (образец: .env.example).
name: stocktaking

x-app: &app
  build: .
  image: stocktaking-app:latest
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
  volumes:
    - media:/data/media
    - static:/data/static
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    <<: *app
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      RUN_MIGRATIONS: "0"
    command: ["python", "manage.py", "run_worker"]
    depends_on:
      web:
        condition: service_healthy

  nginx:
    build: docker/nginx
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - static:/data/static:ro
      - ${TLS_CERT_DIR:-./docker/certs}:/etc/nginx/certs
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
  static:
